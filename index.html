<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bestleeji-lab</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
      --border: #e5e7eb; --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #181b22; --text: #e6e8eb; --muted: #9aa0a6; --border: #2a2f3a; --accent: #8b87ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 1000px; margin: 0 auto; padding: 56px 16px; }
    header { margin-bottom: 32px; }
    h1 { margin: 0 0 4px; font-size: 1.9rem; }
    header p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card {
      display: flex; flex-direction: column; gap: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 22px; color: inherit; text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); border-color: var(--accent); }
    .num { font-size: .8rem; font-weight: 600; color: var(--accent); }
    .card h2 { margin: 0; font-size: 1.15rem; }
    .status { margin-top: auto; font-size: .85rem; color: var(--muted); }
    .card.disabled { cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>bestleeji-lab 실습 모음</h1>
      <p>직접 만든 실습 프로젝트들을 모아두는 곳입니다.</p>
    </header>

    <section class="grid">
      <!-- 링크가 준비되면 href="#"를 실제 주소로 바꾸고 class의 disabled와 onclick을 지우세요 -->
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">01</span><h2>이지혜 Mypage</h2><span class="status">🔒 준비 중</span>
      </a>
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">02</span><h2>손글씨 인식 게임</h2><span class="status">🔒 준비 중</span>
      </a>
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">03</span><h2>Classboard</h2><span class="status">🔒 준비 중</span>
      </a>
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">04</span><h2>MyTasks</h2><span class="status">🔒 준비 중</span>
      </a>
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">05</span><h2>나의 할일 목록</h2><span class="status">🔒 준비 중</span>
      </a>
      <a class="card disabled" href="#" onclick="return false;">
        <span class="num">06</span><h2>yak-s-care</h2><span class="status">🔒 준비 중</span>
      </a>
    </section>
  </main>
</body>
</html>
